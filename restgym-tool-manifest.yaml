# RESTgym tool manifest
manifest_version: 1

id: deeprest
name: DeepREST
version: "25.12"                  # RestTestGen v25.12 (SeUniVr/RestTestGen@63c1963), which includes DeepREST
description: Automated test case generation for REST APIs exploiting deep reinforcement learning, with parameter values also generated by a local LLM.
license: Apache-2.0               # LICENSE of RestTestGen
repository: https://github.com/SeUniVr/RestTestGen
authors:
  - name: Davide Corradini
    affiliation: University of Verona
    orcid: 0009-0009-2594-4562
  - name: Zeno Montolli
    affiliation: University of Verona
    orcid: 0009-0005-2092-4117
  - name: Michele Pasqua
    affiliation: University of Verona
    orcid: 0000-0002-9475-4836
  - name: Mariano Ceccato
    affiliation: University of Verona
    orcid: 0000-0001-7325-0316
citation:
  doi: 10.1145/3691620.3695511    # ASE 2024

compatibility:
  openapi_versions: ["3.0"]       # the parser of RestTestGen supports OpenAPI v3
  spec_formats: [json]            # restgym-entrypoint.sh reads /specifications/${API}-openapi.json
  budgets: [time]

# The LLM runs in the tool container (Ollama, with the model in the image), on the GPU. The PPO agent runs on the CPU.
# Internet is required to build the image (the model is downloaded at build time), not to run the tool.
requirements:
  gpu:
    count: 1
    min_vram_gb: 12
  internet: false

llm:
  models: [qwen3:8b]              # thinking enabled; served by Ollama inside the container
  hosting: local
